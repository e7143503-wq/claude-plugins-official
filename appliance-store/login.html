<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Вход — Тумблер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <header class="site-header" id="site-header"></header>

  <main class="page wrap" data-route="login">
    <div class="auth">
      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title">Вход</h1>
        <p class="auth-lead">Войдите, чтобы оформлять заказы и следить за доставкой.</p>

        <!-- Форма авторизации -->
        <form class="stack" id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Электронная почта</label>
            <input class="input" id="login-email" type="email" autocomplete="email" placeholder="ivan@mail.ru" aria-describedby="login-email-err">
            <p class="field-error" id="login-email-err"></p>
          </div>
          <div class="field">
            <label for="login-pass">Пароль</label>
            <div class="pass-wrap">
              <input class="input" id="login-pass" type="password" autocomplete="current-password" aria-describedby="login-pass-err">
              <button type="button" class="pass-toggle" data-toggle-pass="login-pass" aria-pressed="false" aria-label="Показать пароль"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <p class="field-error" id="login-pass-err"></p>
          </div>
          <p class="form-error" id="login-error" role="alert" hidden></p>
          <button class="btn btn-primary btn-lg btn-block" type="submit">Войти</button>
        </form>

        <!-- Переход на страницу регистрации -->
        <p class="auth-switch">Нет аккаунта? <a href="register.html" id="login-to-register">Зарегистрироваться</a></p>

        <div class="demo-hint">
          <p><b>Демо-аккаунт</b> с историей заказов:<br><code>demo@tumbler.example</code> / <code>demo1234</code></p>
          <button type="button" class="btn btn-ghost btn-sm" id="login-demo">Подставить</button>
        </div>
      </section>

      <aside class="auth-art" aria-hidden="true">
        <div class="auth-art-grid">
          <span data-art-static="fridge" data-color="silver"></span>
          <span data-art-static="coffee" data-color="black"></span>
          <span data-art-static="kettle" data-color="beige"></span>
          <span data-art-static="washer" data-color="white"></span>
        </div>
        <div>
          <h2>Привезём, поднимем, подключим</h2>
          <ul>
            <li><svg class="i" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Доставка по Москве за 1–2 дня</li>
            <li><svg class="i" viewBox="0 0 24 24"><path d="M14.5 5.5a4 4 0 0 0 5 5L12 18a2.1 2.1 0 0 1-3-3l7.5-7.5a4 4 0 0 0-2-2Z"/></svg>Подключение крупной техники</li>
            <li><svg class="i" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6Z"/><path d="m9 12 2 2 4-4"/></svg>Обмен и возврат 14 дней</li>
          </ul>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
